<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链接·梦角 · 专属占卜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:linear-gradient(160deg,#fdf6f6 0%,#f8e9ec 45%,#fdeef2 100%);--text:#4a3f42;--soft:#9a858b;--card:rgba(255,252,251,.93);--border:rgba(255,220,225,.55);--accent:#c48b96;--accent2:#e8c5cb;--btn:linear-gradient(135deg,#c48b96,#d4a5ae);--input:rgba(255,255,255,.7);--shadow:0 8px 32px rgba(180,120,130,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background:var(--bg);background-attachment:fixed;padding:28px 18px 100px;color:var(--text);line-height:1.65;transition:.4s}
body.theme-bw{--bg:linear-gradient(160deg,#f7f7f7,#eee,#f5f5f5);--text:#2c2c2c;--soft:#888;--card:rgba(255,255,255,.96);--border:rgba(0,0,0,.07);--accent:#555;--accent2:#bbb;--btn:linear-gradient(135deg,#3a3a3a,#555);--input:#fff}
body.theme-dark{--bg:linear-gradient(160deg,#1a1618,#221c1f,#1e191b);--text:#f0e6e8;--soft:#b8a5aa;--card:rgba(40,32,35,.94);--border:rgba(180,130,140,.22);--accent:#d4a0ab;--accent2:#8a6a72;--btn:linear-gradient(135deg,#c48b96,#a8727d);--input:rgba(50,40,44,.8)}
body.theme-cream{--bg:linear-gradient(160deg,#faf6f0,#f5eee4,#f8f1e8);--text:#4a433c;--soft:#9a8f84;--card:rgba(255,252,247,.95);--border:rgba(220,200,180,.4);--accent:#c4a882;--accent2:#e0d0b8;--btn:linear-gradient(135deg,#c4a882,#d4bc9a);--input:rgba(255,252,247,.85)}
.container{max-width:420px;margin:auto}.header{text-align:center;margin:12px 0 36px}.header h1{font-size:1.65em;letter-spacing:8px;color:var(--accent);font-weight:300}.header p{color:var(--soft);font-size:.72em;letter-spacing:3px}
.panel{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:24px;padding:26px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.name-row{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:26px}.name-row input{width:90px;border:0;border-bottom:1px solid var(--accent2);background:transparent;text-align:center;padding:8px 4px;font-size:1em;color:var(--text);outline:none}
.q-input{width:100%;padding:14px 18px;border:1px solid var(--accent2);border-radius:50px;background:var(--input);font-size:.95em;text-align:center;outline:none;margin-bottom:26px;color:var(--text)}
button{font-family:inherit;cursor:pointer}.primary{display:block;width:100%;max-width:220px;margin:auto;padding:14px 20px;border:0;border-radius:50px;background:var(--btn);color:white;letter-spacing:3px;font-size:.95em;box-shadow:0 6px 20px rgba(196,139,150,.2)}
.draw-section,.result-section{display:none;text-align:center}.draw-hint{color:var(--soft);margin:8px 0 24px;font-size:.88em;letter-spacing:2px}.deck-btn{display:inline-block;padding:15px 42px;background:var(--card);border:1px solid var(--border);border-radius:50px;color:var(--accent);font-size:1.1em;margin-bottom:30px;box-shadow:var(--shadow)}
.cards-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;min-height:140px}.card{width:88px;min-height:136px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;box-shadow:var(--shadow);transition:.3s}.card.flipped{border-color:var(--accent2);transform:translateY(-5px)}.card-name{font-weight:650;margin-bottom:5px}.tag{font-size:.65em;color:var(--accent);background:rgba(196,139,150,.12);padding:2px 9px;border-radius:20px}.label{font-size:.65em;color:var(--soft);margin-top:7px;letter-spacing:1px}
.result-section{text-align:left;animation:fade .5s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.result-header{text-align:center}.q-label{font-size:.65em;color:var(--soft);letter-spacing:3px}.q-text{font-weight:650;margin-top:6px;overflow-wrap:anywhere}
.result-item{padding:0 0 17px;margin-bottom:17px;border-bottom:1px solid var(--border)}.result-item:last-child{border:0;margin:0;padding:0}.pos{font-size:.65em;color:var(--soft);letter-spacing:1.5px}.result-item .card-name{font-size:1.05em;margin:5px 0 8px}.desc,.guide-body{font-size:.9em;line-height:1.8;text-align:justify}.guide-title{text-align:center;color:var(--accent);letter-spacing:4px;margin-bottom:12px;font-weight:650}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.action{padding:10px 17px;border-radius:40px;border:1px solid var(--border);background:var(--card);color:var(--soft);font-size:.82em}
.fab-wrap{position:fixed;right:20px;bottom:24px;z-index:10}.fab{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--accent);font-size:1.35em;cursor:pointer}.menu{display:none;position:absolute;bottom:62px;right:0;width:175px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:17px;box-shadow:var(--shadow)}.menu.show{display:block}.menu button{display:block;width:100%;padding:9px;border:0;background:transparent;text-align:left;color:var(--text)}.style-label{font-size:.72em;color:var(--soft);padding:7px}.dots{display:flex;gap:9px;padding:5px}.dot{width:27px;height:27px;border-radius:50%;border:2px solid transparent;cursor:pointer}.dot.active{outline:2px solid var(--accent)}.pink{background:linear-gradient(135deg,#f8e9ec,#e8c5cb)}.bw{background:linear-gradient(135deg,#eee,#555)}.dark{background:linear-gradient(135deg,#2a2225,#c48b96)}.cream{background:linear-gradient(135deg,#f5eee4,#c4a882)}
#bgUpload{display:none}
@media(max-width:400px){.card{width:78px;min-height:120px}.header h1{font-size:1.4em;letter-spacing:6px}}
</style>
</head>
<body>
<div class="container">
  <header class="header"><h1>✦ 链接·梦角 ✦</h1><p>作者[格林有木]</p></header>
  <section class="panel" id="setupArea">
    <div class="name-row"><input id="leftName" value="TA" placeholder="TA"><span>✦</span><input id="rightName" value="你" placeholder="你"></div>
    <input id="customQuestion" class="q-input" placeholder="✧ 写下你想问的问题 …">
    <button class="primary" id="startBtn">✦ 开始链接 ✦</button>
  </section>

  <section class="draw-section" id="drawArea">
    <div class="draw-hint">☾ 点击抽牌，抽取 3 张牌 ☽</div>
    <button class="deck-btn" id="deckBtn">抽牌</button>
    <div class="cards-row" id="cardsRow">
      <div class="card"><div class="label">现状</div></div>
      <div class="card"><div class="label">深层</div></div>
      <div class="card"><div class="label">建议</div></div>
    </div>
  </section>

  <section class="result-section" id="resultArea">
    <div class="panel result-header"><div class="q-label">YOUR QUESTION</div><div class="q-text" id="resQ"></div></div>
    <div class="panel" id="resCards"></div>
    <div class="panel"><div class="guide-title">✦ 综合指引 ✦</div><div class="guide-body" id="resGuide"></div></div>
    <div class="actions">
      <button class="action" id="copyBtn">📋 复制结果</button>
      <button class="action" id="continueBtn">🔁 继续占卜</button>
      <button class="action" id="restartBtn">🔄 重新开始</button>
    </div>
  </section>
</div>

<div class="fab-wrap">
  <div class="menu" id="fabMenu">
    <button id="uploadBtn">🌸 上传背景</button><button id="resetBgBtn">↺ 重置背景</button>
    <div class="style-label">风格</div>
    <div class="dots">
      <div class="dot pink active" data-theme="pink" title="粉白"></div>
      <div class="dot bw" data-theme="bw" title="黑白"></div>
      <div class="dot dark" data-theme="dark" title="深色"></div>
      <div class="dot cream" data-theme="cream" title="奶油"></div>
    </div>
  </div>
  <div class="fab" id="fabBtn">☆</div>
</div>
<input type="file" id="bgUpload" accept="image/*">

<script>
const tarotNames=["愚者","魔术师","女祭司","女皇","皇帝","教皇","恋人","战车","力量","隐者","命运之轮","正义","倒吊人","死神","节制","恶魔","塔","星星","月亮","太阳","审判","世界"];
const upright=[
"新的旅程正在展开。放下过度担忧，以轻盈、真诚的心态面对这段链接，允许关系自然生长。",
"主动表达与创造的能量增强。把想法化为行动，清晰沟通会让彼此更容易理解。",
"有些感受尚未说出口。给自己安静观察的空间，留意直觉，也不要急着替对方下结论。",
"温柔、照顾与滋养是当前主题。先让自己处于被爱与有力量的状态，再分享丰盛的情感。",
"稳定和边界很重要。明确自己的期待与原则，可靠的相处方式比一时的热烈更长久。",
"价值观与信念影响着这段关系。尊重彼此不同的理解，找到真正适合双方的相处方式。",
"吸引与选择成为焦点。认真辨认自己的心意，让关系建立在清醒、自愿与相互尊重之上。",
"行动力正在增强。设定方向并稳步前进，但别把关系变成输赢或控制的竞赛。",
"温柔比强硬更有力量。耐心面对不安，允许脆弱存在，也记得善待自己。",
"暂时的独处有助于看清内心。给彼此适度空间，沉淀之后再决定下一步。",
"局势可能出现转变。保持弹性，接纳无法完全掌控的部分，把注意力放回当下能做的事。",
"诚实与平衡是关键。看清事实、表达需求，并为自己的选择承担责任。",
"换一个角度看待问题。暂缓仓促决定，放下无效的执着，新的理解可能随之出现。",
"一个阶段正在结束，另一个阶段有机会开始。允许旧模式退场，为改变留出空间。",
"循序渐进地调整节奏。耐心、协调与适度沟通，能帮助关系回到更舒服的位置。",
"强烈的渴望或依恋值得被看见。辨认热情与束缚的区别，选择让自己更自由的相处方式。",
"突发变化可能打破原有认知。先稳住情绪，再检查哪些期待或模式需要重新建立。",
"希望正在恢复。把目光放远一些，照顾好自己的愿望，不必因为暂时看不清就否定未来。",
"情绪与想象可能放大不确定感。核实信息、照顾感受，避免只凭猜测做判断。",
"清晰、坦诚与快乐是这张牌的主题。珍惜真实的互动，也让自己拥有独立的光芒。",
"适合回顾过去并作出新的决定。听见内心真正重视的东西，给自己重新选择的机会。",
"一个阶段有望整合与完成。看见已经走过的路，也带着经验进入更完整的新篇章。"
];
const reversed=[
"对未知的顾虑可能让你迟疑。先从小而真实的一步开始，不必为了得到答案而勉强自己。",
"想法很多却难以落实。把期待说得具体一些，并留意言语与行动是否一致。",
"信息仍不充分，或有情绪被压在心底。不要急着猜测，等自己准备好再坦诚沟通。",
"过度付出可能让你忽略自己。先补充自己的能量，爱不应该以失去自我为代价。",
"控制感或僵化的规则带来压力。重新检查边界是否合理，稳定不等于限制。",
"旧有观念可能束缚选择。允许自己探索不同方式，不必为了符合他人期待而勉强。",
"犹豫或不一致让关系显得模糊。回到自己的价值与需求，再决定是否继续投入。",
"急于推进反而容易失去方向。放慢速度，确认双方是否真的朝同一个方向前进。",
"疲惫或自我怀疑正在累积。休息并寻求支持，勇敢也包括承认自己需要照顾。",
"独处可能变成封闭。适度向可信任的人表达感受，不必独自承担所有困惑。",
"抗拒变化会让你更焦虑。先分清能控制与不能控制的事，再选择可行的调整。",
"如果觉得不公平，先厘清事实与期待。用清楚的沟通代替反复猜测或自我责备。",
"停滞可能来自不愿放手。试着松开旧的解释，给自己一个重新理解局面的机会。",
"对结束的恐惧可能阻碍更新。改变不一定是否定过去，也可能是走向更合适的阶段。",
"节奏失衡时，先减少消耗。回到日常生活与稳定习惯，再处理复杂的情绪议题。",
"依赖、占有或执念可能变得沉重。辨认自己的真实需要，选择尊重彼此自由的连接。",
"变化带来的不安需要时间消化。不要在情绪最高点作决定，先修复基础再谈未来。",
"暂时看不到希望时，别急着否定自己。寻找现实中可依靠的支持，让信心慢慢恢复。",
"误会、恐惧或投射可能干扰判断。把事实与想象分开，必要时直接询问而不是猜测。",
"疲惫可能遮住原本的快乐。减少不必要的压力，给自己恢复活力的时间。",
"你可能听见了内心的提醒，却还没准备行动。允许自己思考，但也别无限期忽略真实需求。",
"尚有未完成的事情需要整理。耐心收尾、总结经验，再开启下一段旅程。"
];
const positions=["现状","深层","建议"];
let selectedCards=[],drawnCount=0,customQ="",finalCopyText="";
const $=id=>document.getElementById(id);
const setupArea=$("setupArea"),drawArea=$("drawArea"),resultArea=$("resultArea");
const questionInput=$("customQuestion"),cardsRow=$("cardsRow"),deckBtn=$("deckBtn");
function resetDrawArea(){
  selectedCards=[];drawnCount=0;finalCopyText="";
  cardsRow.innerHTML=positions.map(p=>`<div class="card"><div class="label">${p}</div></div>`).join("");
  deckBtn.textContent="抽牌";
}
function showSetup(clearQuestion=false){
  setupArea.style.display="block";drawArea.style.display="none";resultArea.style.display="none";
  resetDrawArea();
  if(clearQuestion) questionInput.value="";
  window.scrollTo({top:0,behavior:"smooth"});
}
$("startBtn").addEventListener("click",()=>{
  customQ=questionInput.value.trim()||"（未输入问题）";
  resetDrawArea();setupArea.style.display="none";resultArea.style.display="none";drawArea.style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
});
deckBtn.addEventListener("click",()=>{
  if(drawnCount>=3)return;
  let idx;do{idx=Math.floor(Math.random()*tarotNames.length)}while(selectedCards.some(c=>c.index===idx));
  const reversed=Math.random()>.5;
  selectedCards.push({index:idx,name:tarotNames[idx],reversed,meaning:(reversed?reversedMeanings:upright)[idx]});
  const slot=cardsRow.children[drawnCount];
  slot.innerHTML=`<div class="card-name">${tarotNames[idx]}</div><div class="tag">${reversed?"逆位":"正位"}</div><div class="label">${positions[drawnCount]}</div>`;
  slot.classList.add("flipped");drawnCount++;
  if(drawnCount===3){deckBtn.textContent="✓ 已抽完";setTimeout(showResult,650)}
});
function showResult(){
  $("resQ").textContent=customQ;
  $("resCards").innerHTML=selectedCards.map((c,i)=>`
    <div class="result-item"><div class="pos">第 ${i+1} 张 · ${positions[i]}</div>
    <div class="card-name">${c.name}（${c.reversed?"逆位":"正位"}）</div>
    <div class="desc">${c.meaning}</div></div>`).join("");
  const names=selectedCards.map(c=>c.name).join("、");
  $("resGuide").textContent=`这次抽到的三张牌是${names}。整体来看，这组牌邀请你把注意力放回真实感受与实际互动：先观察当下的状态，再理解自己深层的期待，最后选择一个温和、具体且尊重彼此边界的行动。塔罗可以作为自我觉察与整理思路的参考，并不能替任何人保证对方的想法或未来。`;
  finalCopyText=`链接·梦角｜占卜结果\n问题：${customQ}\n\n`+selectedCards.map((c,i)=>`${positions[i]}：${c.name}（${c.reversed?"逆位":"正位"}）\n${c.meaning}`).join("\n\n")+`\n\n综合指引：${$("resGuide").textContent}`;
  drawArea.style.display="none";resultArea.style.display="block";window.scrollTo({top:0,behavior:"smooth"});
}
$("copyBtn").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(finalCopyText);$("copyBtn").textContent="✓ 已复制";setTimeout(()=>$("copyBtn").textContent="📋 复制结果",1600)}
  catch(e){const ta=document.createElement("textarea");ta.value=finalCopyText;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();$("copyBtn").textContent="✓ 已复制";setTimeout(()=>$("copyBtn").textContent="📋 复制结果",1600)}
});
// 关键修复：继续占卜返回设置页，保留名字和上次问题，允许修改
$("continueBtn").addEventListener("click",()=>{
  questionInput.value=customQ==="（未输入问题）"?"":customQ;
  showSetup(false);
});
// 重新开始：返回设置页并清空问题、恢复默认名字
$("restartBtn").addEventListener("click",()=>{
  $("leftName").value="TA";$("rightName").value="你";showSetup(true);
});
// 主题菜单
$("fabBtn").addEventListener("click",e=>{e.stopPropagation();$("fabMenu").classList.toggle("show")});
document.addEventListener("click",e=>{if(!$("fabMenu").contains(e.target)&&e.target!==$("fabBtn"))$("fabMenu").classList.remove("show")});
document.querySelectorAll(".dot").forEach(dot=>dot.addEventListener("click",()=>{
  document.body.classList.remove("theme-bw","theme-dark","theme-cream");
  const t=dot.dataset.theme;if(t!=="pink")document.body.classList.add("theme-"+t);
  document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));dot.classList.add("active");
}));
const bgUpload=$("bgUpload");
$("uploadBtn").addEventListener("click",()=>{bgUpload.click();$("fabMenu").classList.remove("show")});
bgUpload.addEventListener("change",e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();reader.onload=ev=>{document.body.style.background=`url("${ev.target.result}") center/cover fixed no-repeat`};reader.readAsDataURL(file);
});
$("resetBgBtn").addEventListener("click",()=>{document.body.style.background="";bgUpload.value="";$("fabMenu").classList.remove("show")});
</script>
</body>
</html>
